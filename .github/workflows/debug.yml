name: debug
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > debug.txt 2>&1
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for u in company/96882 industry?pageSize=2 daily?pageSize=2 market?pageSize=2 invest?pageSize=2 economy?pageSize=2 debenture?pageSize=1; do echo "== $u"; curl -sL -A "$UA" "https://m.stock.naver.com/api/research/$u" | head -c 1500; echo; done
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add debug.txt; git commit -m debug-out; git push
